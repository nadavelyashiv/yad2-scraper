name: Yad2 Scraper

on:
  schedule:
    - cron: '13,43 5-18 * * *'
  workflow_dispatch:
    

jobs:
  scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: |
          pip install -r requirements.txt
          python -m camoufox fetch

      - name: Setup git config
        run: |
          git config user.name "GitHub Actions"
          git config user.email "${{ secrets.GIT_CONFIG_EMAIL }}"

      - name: Run scrapers
        run: |
          export API_TOKEN=${{ secrets.API_TOKEN }}
          export CHAT_ID=${{ secrets.CHAT_ID }}
          export FB_C_USER=${{ secrets.FB_C_USER }}
          export FB_XS=${{ secrets.FB_XS }}
          export GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          export GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          python clean_caches.py
          python yad2_scraper.py &
          python madlan_scraper.py &
          python facebook_scraper.py &
          wait

      - name: Push new json data if needed
        run: |
          if [ -f ./push_me ]; then
            echo Pushing to Github...
            git add data
            DATE=$(date +"%F, %H:%M:%S")
            git commit -m "updated data - $DATE"
            git push
          fi

      - name: Upload scraper logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs
          path: scraper.log
          retention-days: 7
